<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KI-Agent Interface</title>
  <style>
    :root { --bg: #0d0d0d; --surface: #1a1a1a; --border: #2d2d2d; --accent: #00d4ff; --green: #00ff88; --red: #ff4545; --text: #e0e0e0; --muted: #888; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; }
    header h1 { font-size: 1.2rem; color: var(--accent); }
    .logout-btn { margin-left: auto; background: var(--red); color: #fff; border: none; border-radius: 6px; padding: 6px 16px; cursor: pointer; font-size: 0.85rem; }
    
    .layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 340px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
    .main-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
    
    label { display: block; font-size: 0.8rem; color: var(--muted); margin: 12px 0 4px; }
    input, select { width: 100%; background: #111; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 8px 10px; font-size: 0.9rem; }
    
    .root-warning { display: none; background: #ff45451a; border: 1px solid var(--red); color: var(--red); padding: 10px; border-radius: 6px; font-size: 0.8rem; margin-top: 8px; line-height: 1.4; }
    .root-warning strong { display: block; margin-bottom: 4px; }

    .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
    .msg.user { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.ai { background: var(--surface); border: 1px solid var(--border); color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; }
    
    .chat-input-area { padding: 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .chat-input-row { display: flex; gap: 10px; }
    .chat-input-row textarea { flex: 1; background: #111; border: 1px solid var(--border); border-radius: 8px; color: #fff; padding: 12px; min-height: 50px; resize: vertical; outline: none; }
    .btn-send { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 0 20px; font-weight: bold; cursor: pointer; }
    
    .context-box { display: flex; gap: 8px; align-items: center; }
    .context-box input { flex: 1; background: #222; border: 1px dashed var(--muted); }
    .context-help { font-size: 0.7rem; color: var(--muted); }

    .console-overlay { position: absolute; top: 0; right: 0; width: 350px; bottom: 0; background: #050505e6; border-left: 1px solid var(--border); padding: 10px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; display: none; }
    .log-info { color: #aaa; margin-bottom: 4px; }
    
    .save-btn { width: 100%; background: var(--accent); color: #000; border: none; border-radius: 6px; padding: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .loading-text { color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
  </style>
</head>
<body>

<header>
  <h1>&#129302; KI-Agent v0.0.1 Beta</h1>
  <button onclick="toggleConsole()" style="margin-left:auto; background:#222; color:#fff; border:1px solid #444; border-radius:4px; padding:4px 10px; cursor:pointer; font-size:0.8rem; margin-right:10px;">Terminal</button>
  <button class="logout-btn" onclick="logout()">Abmelden</button>
</header>

<div class="layout">
  <div class="sidebar">
    <h3 style="font-size:0.9rem; color:var(--accent); margin-bottom:10px;">⚙️ Konfiguration</h3>
    
    <label>Provider</label>
    <select id="provider" onchange="providerChanged()">
      <option value="groq">Groq (Kostenlos)</option>
      <option value="openai">OpenAI</option>
      <option value="claude">Claude</option>
      <option value="gemini">Gemini</option>
      <option value="mistral">Mistral AI</option>
      <option value="xai">xAI (Grok)</option>
      <option value="deepseek">DeepSeek</option>
      <option value="cohere">Cohere</option>
      <option value="openrouter">OpenRouter</option>
    </select>
    
    <label>API Key (wird verschlüsselt gespeichert)</label>
    <input type="password" id="apiKey" placeholder="API Key eingeben..." onchange="apiKeyChanged()">
    
    <label>Modell <span id="modelLoading" class="loading-text" style="display:none;">(lädt...)</span></label>
    <select id="modelSelect">
      <option value="">Standard-Modell verwenden</option>
    </select>
    
    <button class="save-btn" onclick="saveSettings()">Einstellungen speichern</button>

    <label style="margin-top:20px;">Arbeitsverzeichnis</label>
    <select id="dirPreset" onchange="checkRootWarning()">
      <option value="/var/www/html">Webserver (/var/www/html)</option>
      <option value="/home">Home-Ordner (/home)</option>
      <option value="/">⚠️ Root-Zugriff (/)</option>
    </select>
    <input type="text" id="directory" value="/var/www/html" style="margin-top:6px;">
    
    <div id="rootWarning" class="root-warning">
      <strong>ACHTUNG!</strong> Voller Root-Zugriff!
    </div>

    <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0 10px 0;">
    <button onclick="updateSystem()" style="width:100%; background:#222; color:var(--green); border:1px solid var(--green); border-radius:6px; padding:8px; font-size:0.8rem; cursor:pointer; font-weight:bold;">&#8635; System updaten</button>
  </div>

  <div class="main-area">
    <div class="chat-history" id="chatHistory">
      <div class="msg ai">Hallo! Sag mir was ich tun soll.

💡 Tipp: Ich arbeite automatisch an deiner Aufgabe und stoppe wenn fertig!</div>
    </div>
    
    <div class="chat-input-area">
      <div class="context-help">📁 Optional: Dateien/Ordner senden</div>
      <div class="context-box">
        <input type="text" id="contextPath" placeholder="z.B. /var/www/html/index.html">
      </div>
      <div class="chat-input-row">
        <textarea id="promptInput" placeholder="z.B. 'Erstelle 3 Webseiten über Anime'"></textarea>
        <button class="btn-send" onclick="sendPrompt()">Senden</button>
      </div>
    </div>
    
    <div class="console-overlay" id="console"></div>
  </div>
</div>

<script>
  let sessionId = null;
  let ws;

  function checkRootWarning() {
    const v = document.getElementById('dirPreset').value;
    document.getElementById('directory').value = v;
    document.getElementById('rootWarning').style.display = (v === '/') ? 'block' : 'none';
  }

  function toggleConsole() {
    const c = document.getElementById('console');
    c.style.display = c.style.display === 'block' ? 'none' : 'block';
  }

  function addMsg(sender, text) {
    const h = document.getElementById('chatHistory');
    const d = document.createElement('div');
    d.className = `msg ${sender}`;
    d.innerText = text;
    h.appendChild(d);
    h.scrollTop = h.scrollHeight;
  }

  function addLog(text) {
    const c = document.getElementById('console');
    const d = document.createElement('div');
    d.className = 'log-info'; d.innerText = text;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
  }

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'chat') addMsg(msg.sender, msg.message);
      if (msg.type === 'log')  addLog(msg.message);
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
  }
  connectWS();

  async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/';
  }

  async function loadSettings() {
    const res = await fetch('/api/user/settings');
    if(res.ok) {
      const data = await res.json();
      document.getElementById('provider').value = data.provider || 'groq';
      document.getElementById('apiKey').value = data.apiKey || '';
      if (data.apiKey) await loadModels();
      if (data.model) document.getElementById('modelSelect').value = data.model;
    }
  }
  loadSettings();

  function providerChanged() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (apiKey) loadModels();
  }

  function apiKeyChanged() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (apiKey) loadModels();
  }

  async function loadModels() {
    const provider = document.getElementById('provider').value;
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) return;

    const loading = document.getElementById('modelLoading');
    const select = document.getElementById('modelSelect');
    loading.style.display = 'inline';
    select.innerHTML = '<option value="">Lädt...</option>';

    try {
      const res = await fetch('/api/models', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider, apiKey })
      });
      
      if (res.ok) {
        const data = await res.json();
        select.innerHTML = '<option value="">Standard-Modell</option>';
        data.models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.innerText = m.name || m.id;
          if (m.free) opt.innerText += ' (KOSTENLOS)';
          select.appendChild(opt);
        });
      } else {
        select.innerHTML = '<option value="">Fehler</option>';
      }
    } catch(e) {
      select.innerHTML = '<option value="">Fehler</option>';
    }
    loading.style.display = 'none';
  }

  async function saveSettings() {
    const provider = document.getElementById('provider').value;
    const apiKey = document.getElementById('apiKey').value.trim();
    const model = document.getElementById('modelSelect').value;
    
    try {
      const res = await fetch('/api/user/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider, apiKey, model })
      });
      
      if (res.ok) {
        alert('✔️ Gespeichert!');
      } else {
        const err = await res.json();
        alert('❌ ' + (err.error || 'Fehler'));
      }
    } catch(e) {
      alert('❌ ' + e.message);
    }
  }

  async function sendPrompt() {
    const provider    = document.getElementById('provider').value;
    const apiKey      = document.getElementById('apiKey').value.trim();
    const model       = document.getElementById('modelSelect').value;
    const directory   = document.getElementById('directory').value.trim();
    const prompt      = document.getElementById('promptInput').value.trim();
    const contextPath = document.getElementById('contextPath').value.trim();

    if(!prompt) return;
    if(!apiKey && !sessionId) { alert("⚠️ API Key fehlt!"); return; }

    // WICHTIG: Zeige User-Nachricht SOFORT im Chat an
    addMsg('user', prompt);
    
    document.getElementById('promptInput').value = '';
    document.getElementById('contextPath').value = '';

    if(!sessionId) {
      const res = await fetch('/api/start', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider, apiKey, model, directory, prompt, contextPath })
      });
      if(res.status === 401) { alert("Session abgelaufen!"); window.location.href='/'; return; }
      const data = await res.json();
      sessionId = data.sessionId;
    } else {
      await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, prompt, contextPath })
      });
    }
  }

  async function updateSystem() {
    if(!confirm("🔄 Updaten?")) return;
    addLog("Suche Updates...");
    const res = await fetch('/api/update', { method: 'POST' });
    if(res.status === 401) { alert("Session abgelaufen!"); window.location.href='/'; return; }
    const data = await res.json();
    if(data.success) {
      addLog(`✔️ ${data.message}`);
      alert("✔️ Update erfolgreich!");
    } else {
      addLog(`❌ ${data.error}`);
      alert(`❌ ${data.error}`);
    }
  }
</script>
</body>
</html>
