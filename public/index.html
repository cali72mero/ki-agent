<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KI-Agent &ndash; Pers\u00f6nlicher AI Agent</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --border: #2d2d2d;
      --accent: #00d4ff;
      --green: #00ff88;
      --red: #ff4545;
      --yellow: #ffd700;
      --text: #e0e0e0;
      --muted: #888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    header span { background: #00ff8822; color: var(--green); font-size: 0.7rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--green); }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card h2 { font-size: 0.85rem; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
    label:first-of-type { margin-top: 0; }
    input, select, textarea {
      width: 100%; background: #111; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 9px 12px; font-size: 0.9rem; outline: none; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    .btn { width: 100%; padding: 11px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 14px; transition: opacity .2s; }
    .btn:hover { opacity: .85; }
    .btn-start { background: var(--accent); color: #000; }
    .btn-stop  { background: var(--red);   color: #fff; }
    .console {
      background: #050505; border: 1px solid var(--border); border-radius: 8px;
      height: 520px; overflow-y: auto; padding: 14px 16px;
      font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace; font-size: 0.82rem;
      line-height: 1.6; white-space: pre-wrap; word-break: break-all;
    }
    .log-info   { color: var(--text); }
    .log-cmd    { color: var(--accent); }
    .log-ok     { color: var(--green); }
    .log-err    { color: var(--red); }
    .log-warn   { color: var(--yellow); }
    .log-step   { color: #cc99ff; }
    .sessions { margin-top: 16px; }
    .sessions h2 { font-size: 0.85rem; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; }
    .session-badge { display: inline-block; background: #00ff8811; border: 1px solid var(--green); color: var(--green); border-radius: 6px; padding: 3px 10px; font-size: 0.78rem; margin: 3px; }
    .status-bar { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
    #wsStatus { color: var(--green); font-weight: 600; }
    select option { background: #1a1a1a; }
    @media(max-width:720px){ .container{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
<header>
  <div style="font-size:1.5rem">&#129302;</div>
  <h1>KI-Agent</h1>
  <span>LIVE</span>
  <div style="margin-left:auto;font-size:0.8rem;color:var(--muted)" id="wsStatus">Verbinde...</div>
</header>

<div class="container">
  <!-- LINKE SPALTE: Einstellungen -->
  <div>
    <div class="card">
      <h2>&#9881; Einstellungen</h2>

      <label>KI-Anbieter</label>
      <select id="provider">
        <option value="groq">Groq (Llama 3.3 &ndash; sehr schnell &amp; kostenlos)</option>
        <option value="openai">OpenAI (GPT-4o)</option>
        <option value="claude">Claude (Anthropic)</option>
        <option value="openrouter">OpenRouter (viele Modelle)</option>
      </select>

      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="sk-... oder gsk_..." autocomplete="off">

      <label>Modell (optional, Standard wird automatisch gew\u00e4hlt)</label>
      <input type="text" id="model" placeholder="z.B. llama-3.3-70b-versatile, gpt-4o ...">

      <label>Zielverzeichnis (Root-Zugriff)</label>
      <select id="dirPreset" onchange="applyDirPreset()">
        <option value="/var/www/html">Webserver-Root (/var/www/html)</option>
        <option value="custom">/var/www/html/[eigener Ordner]</option>
        <option value="/home">Home-Verzeichnis (/home)</option>
        <option value="/opt">Programme (/opt)</option>
        <option value="/">Voller Root-Zugriff (/)</option>
        <option value="manual">Manuell eingeben...</option>
      </select>
      <input type="text" id="directory" value="/var/www/html" style="margin-top:6px">

      <label>Deine Aufgabe f\u00fcr den Agenten</label>
      <textarea id="taskPrompt" placeholder="z.B.: Erstelle eine vollst\u00e4ndige Restaurant-Webseite mit HTML, CSS und einer Speisekarte im Ordner /var/www/html/restaurant. Behebe alle Fehler und stelle sicher, dass die Seite sch\u00f6n aussieht."></textarea>

      <label>Deadline (Uhrzeit, bis wann der Agent arbeiten darf)</label>
      <input type="time" id="deadline" value="15:00">

      <button class="btn btn-start" onclick="startAgent()">&#9654; Agent starten</button>
      <button class="btn btn-stop"  onclick="stopAgent()" style="display:none" id="btnStop">&#9632; Agent stoppen</button>
    </div>

    <div class="sessions" id="sessionsBox" style="display:none">
      <div class="card">
        <h2>&#128295; Aktive Sessions</h2>
        <div id="sessionList"></div>
      </div>
    </div>
  </div>

  <!-- RECHTE SPALTE: Live-Log -->
  <div class="card">
    <h2>&#128250; Live-Terminal-Output</h2>
    <div class="status-bar">WebSocket: <span id="wsStatus2">Verbinde...</span> &nbsp;|&nbsp; Session: <span id="currentSession">-</span></div>
    <div class="console" id="console">Warte auf Agent-Start...
</div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button onclick="clearConsole()" style="background:#222;color:#888;border:1px solid #333;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:0.8rem">&#128465; Leeren</button>
      <button onclick="scrollBottom()" style="background:#222;color:#888;border:1px solid #333;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:0.8rem">&#8595; Runterscrollen</button>
    </div>
  </div>
</div>

<script>
  let ws;
  let currentSessionId = null;

  // WebSocket-Verbindung
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onopen  = () => setWsStatus(true);
    ws.onclose = () => { setWsStatus(false); setTimeout(connectWS, 3000); };
    ws.onerror = () => setWsStatus(false);
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'connected') { setWsStatus(true); return; }
      if (msg.type === 'log') appendLog(msg.message, msg.time);
    };
  }

  function setWsStatus(ok) {
    const s = ok ? '&#9679; Verbunden' : '&#9679; Getrennt';
    document.getElementById('wsStatus').innerHTML  = s;
    document.getElementById('wsStatus2').innerHTML = s;
    document.getElementById('wsStatus').style.color  = ok ? 'var(--green)' : 'var(--red)';
    document.getElementById('wsStatus2').style.color = ok ? 'var(--green)' : 'var(--red)';
  }

  function appendLog(msg, time) {
    const con = document.getElementById('console');
    let cls = 'log-info';
    if (msg.includes('\u274c'))  cls = 'log-err';
    else if (msg.includes('\u26a0\ufe0f'))  cls = 'log-warn';
    else if (msg.includes('\u2705') || msg.includes('\u2714')) cls = 'log-ok';
    else if (msg.includes('\ud83d\udcbb'))  cls = 'log-cmd';
    else if (msg.includes('Schritt')) cls = 'log-step';

    const line = document.createElement('div');
    line.className = cls;
    line.textContent = (time ? `[${time}] ` : '') + msg;
    con.appendChild(line);
    scrollBottom();
  }

  function scrollBottom() {
    const con = document.getElementById('console');
    con.scrollTop = con.scrollHeight;
  }

  function clearConsole() {
    document.getElementById('console').innerHTML = '';
  }

  function applyDirPreset() {
    const v = document.getElementById('dirPreset').value;
    if (v !== 'manual' && v !== 'custom') document.getElementById('directory').value = v;
  }

  async function startAgent() {
    const provider   = document.getElementById('provider').value;
    const apiKey     = document.getElementById('apiKey').value.trim();
    const model      = document.getElementById('model').value.trim();
    const directory  = document.getElementById('directory').value.trim();
    const taskPrompt = document.getElementById('taskPrompt').value.trim();
    const deadline   = document.getElementById('deadline').value;

    if (!apiKey)     { alert('Bitte API Key eingeben!'); return; }
    if (!taskPrompt) { alert('Bitte Aufgabe eingeben!'); return; }
    if (!directory)  { alert('Bitte Verzeichnis eingeben!'); return; }

    clearConsole();
    appendLog('\ud83d\ude80 Sende Anfrage an Server...');

    try {
      const res = await fetch('/api/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider, apiKey, model, directory, taskPrompt, deadline })
      });
      if (res.status === 401) { alert('Falsche Login-Daten!'); return; }
      const data = await res.json();
      if (data.success) {
        currentSessionId = data.sessionId;
        document.getElementById('currentSession').textContent = data.sessionId;
        document.getElementById('btnStop').style.display = 'block';
        appendLog(`\u2705 Agent ${data.sessionId} gestartet!`);
        refreshSessions();
      } else {
        appendLog(`\u274c Fehler: ${data.error}`);
      }
    } catch(e) {
      appendLog(`\u274c Netzwerkfehler: ${e.message}`);
    }
  }

  async function stopAgent() {
    if (!currentSessionId) return;
    try {
      const res = await fetch(`/api/stop/${currentSessionId}`, { method: 'POST' });
      const data = await res.json();
      appendLog(data.success ? `\u26d4 Agent ${currentSessionId} gestoppt.` : '\u26a0\ufe0f Kein aktiver Agent gefunden.');
      document.getElementById('btnStop').style.display = 'none';
      currentSessionId = null;
    } catch(e) { appendLog(`\u274c Fehler: ${e.message}`); }
  }

  async function refreshSessions() {
    try {
      const res = await fetch('/api/agents');
      if (!res.ok) return;
      const data = await res.json();
      const box  = document.getElementById('sessionsBox');
      const list = document.getElementById('sessionList');
      if (data.agents.length > 0) {
        box.style.display = 'block';
        list.innerHTML = data.agents.map(id => `<span class="session-badge">&#9679; ${id}</span>`).join('');
      } else {
        box.style.display = 'none';
      }
    } catch(e) {}
  }

  setInterval(refreshSessions, 5000);
  connectWS();
  refreshSessions();
</script>
</body>
</html>
